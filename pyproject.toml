[project]
name = "rent-showcase"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6.0",
    "psycopg[binary]>=3.2",
    "pillow>=11.0",
    "python-decouple>=3.8",
    "whitenoise[brotli]>=6.8",
    "gunicorn>=23.0",
    "django-allauth[google]>=65.16.1",
    "pyjwt>=2.12.1",
    "cryptography>=48.0.0",
]

[dependency-groups]
dev = [
    "django-browser-reload>=1.17",
    "pytest-django>=4.9",
    "factory-boy>=3.3",
    "pytest-playwright>=0.6",
    "pytest-xdist>=3.6",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --reuse-db"
filterwarnings = [
    "ignore::DeprecationWarning:factory",
]
markers = [
    "e2e: end-to-end browser tests (skip with: -m 'not e2e')",
]
